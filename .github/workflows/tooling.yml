name: Build Crisis de Estado
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LLVM_CONFIG: /usr/bin/llvm-config-18
      TAR_OPTIONS: --no-same-owner
      USE_CCACHE: "0"
      BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 llvm-18-dev lld-18 make ninja-build g++ python3 wget curl unzip tar exfatprogs libsdl2-dev
      - name: Gameplay, render and desktop build
        run: make gameplay-test preview desktop
      - name: Native title and verified exFAT
        run: make exfat
      - name: Release files
        run: |
          cd dist
          zip -9 CrisisDeEstado-v0.2.exfat.zip CrisisDeEstado-v0.2.exfat
          sha256sum CrisisDeEstado-v0.2.exfat CrisisDeEstado-v0.2.exfat.zip PPSA99764.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CrisisDeEstado-PS5-v0.2
          path: |
            dist/CrisisDeEstado-v0.2.exfat.zip
            dist/PPSA99764.zip
            dist/SHA256SUMS.txt
